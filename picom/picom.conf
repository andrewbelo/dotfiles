# My config. Not much to see here; just some pretty standard stuff.

backend = "glx";
vsync = true;
shadow = false;
blur-background-frame = false;

# The blur radius for shadows, in pixels. (defaults to 12)
# shadow-radius = 10;

# The opacity of shadows. (0.0 - 1.0, defaults to 0.75)
# shadow-opacity = 0.0

# The left offset for shadows, in pixels. (defaults to -15)
# shadow-offset-x = -3;
#
# The top offset for shadows, in pixels. (defaults to -15)
# shadow-offset-y = -3;

# Specify a list of conditions of windows that should have no shadow.
#
# examples:
#   shadow-exclude = "n:e:Notification";
#
# shadow-exclude = []
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "class_g = 'trayer'",
  "class_g = 'jetbrains-datagrip'",
  "class_g = 'Zen'",
  "class_g = 'zen'",
  "override_redirect = true",
  "_GTK_FRAME_EXTENTS@:c",
  "bounding_shaped",
  "class_g = 'Zen' && window_type = 'popup_menu'",
  "class_g = 'zen' && window_type = 'popup_menu'"
];


# Fade windows in/out when opening/closing and when opacity changes,
#  unless no-fading-openclose is used.
# fading = false
fading = true;

# Opacity change between steps while fading in. (0.01 - 1.0, defaults to 0.028)
# fade-in-step = 0.028
fade-in-step = 0.03;

# Opacity change between steps while fading out. (0.01 - 1.0, defaults to 0.03)
# fade-out-step = 0.03
fade-out-step = 0.03;

# The time between steps in fade step, in milliseconds. (> 0, defaults to 10)
# fade-delta = 10

# Specify a list of conditions of windows that should not be faded.
# don't need this, we disable fading for all normal windows with wintypes: {}
fade-exclude = [
  "class_g = 'slop'",   # maim
  "class_g = 'jetbrains-datagrip'",
  "class_g = 'Zen' && window_type = 'popup_menu'"
]

# Opacity of inactive windows. (0.1 - 1.0, defaults to 1.0)
inactive-opacity = 0.8
# inactive-opacity = 1.00

# Opacity of window titlebars and borders. (0.1 - 1.0, disabled by default)
# frame-opacity = 1.0
frame-opacity = 1.0

#If using these 2 below change their values in line 510 & 511 aswell
# popup_menu = { opacity = 1.0; shadow = false; full-shadow = false;} 
# dropdown_menu = { opacity = 1.0; shadow = false; full-shadow = false;} 

# Let inactive opacity set by -i override the '_NET_WM_OPACITY' values of windows.
# inactive-opacity-override = true
inactive-opacity-override = false;

# Default opacity for active windows. (0.0 - 1.0, defaults to 1.0)
active-opacity = 0.97

# Dim inactive windows. (0.0 - 1.0, defaults to 0.0)
inactive-dim = 0.5

# Specify a list of conditions of windows that should always be considered focused.
# focus-exclude = []
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Bar'",                    # lemonbar
  "class_g = 'slop'",                    # maim
  "class_g = 'trayer'",                  # trayer
  "class_g = 'jetbrains-datagrip'"
];

opacity-rule = [
  "100:class_g    = 'XTerm'",
  "100:class_g    = 'URxvt'",
  "98:class_g    = 'firefox'",
  "98:class_g    = 'Zen'",
  "95:class_g    = 'Brave-browser'",
  "95:class_g    = 'zen'",
  "100:class_g    = 'Thunderbird'",
  "100:class_g    = 'i3lock'",
  "100:class_g    = 'i3lock'",
  "100:class_g    = 'xss-lock'",
  "100:class_g    = 'vlc'",
  "100:class_g    = 'Rofi'"
];

wintypes:
{
  normal = { fade = false; shadow = false; }
  tooltip = { fade = true; shadow = false; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = {
    opacity = 1.0;
    shadow = false;  # Explicitly no shadows
    fade = false;    # Explicitly no fading for popup menus
    blur-background = false;
  }
  dropdown_menu = {
    opacity = 1.0;
    shadow = false;  # Explicitly no shadows
    fade = false;    # Explicitly no fading for dropdown menus
    blur-background = false;
  }
};

